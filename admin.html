<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - FlavioOfertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Roboto', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <div id="loginScreen" class="fixed inset-0 bg-[#2d3277] z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96 text-center">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Área Restrita</h2>
            <input type="password" id="senhaInput" class="w-full border-2 border-gray-300 p-3 rounded mb-4" placeholder="Digite a senha">
            <button onclick="fazerLogin()" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700">ENTRAR</button>
        </div>
    </div>

    <div id="adminContent" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-[#2d3277] text-white p-4 shadow-md flex justify-between items-center flex-shrink-0">
            <h1 class="text-xl font-bold text-[#fff159]">Admin <span class="text-white">FlavioOfertas</span></h1>
            <button onclick="logout()" class="text-xs bg-red-500 px-3 py-1 rounded hover:bg-red-600">Sair</button>
        </header>

        <main class="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full overflow-y-auto">
            
            <div class="bg-white rounded-lg shadow-md mb-8 overflow-hidden">
                <div class="flex border-b">
                    <button onclick="mudarAba('auto')" id="tabAuto" class="flex-1 py-4 font-bold text-[#2d3277] border-b-4 border-[#2d3277] bg-gray-50 transition">
                        <i class="ph-bold ph-robot"></i> Automático
                    </button>
                    <button onclick="mudarAba('manual')" id="tabManual" class="flex-1 py-4 font-bold text-gray-400 hover:text-gray-600 transition">
                        <i class="ph-bold ph-pencil-simple"></i> Manual
                    </button>
                </div>

                <div class="p-6">
                    <div id="formAuto">
                        <label class="block mb-2 font-bold text-gray-700">1. Escolha a Categoria</label>
                        <select id="autoCategoryInput" class="w-full border p-3 rounded mb-4 bg-gray-50 font-medium">
                            <option value="Tecnologia">📱 Tecnologia</option>
                            <option value="Cozinha">🍳 Cozinha</option>
                            <option value="Casa e Decoração">🏠 Casa e Decoração</option>
                            <option value="Moda e Beleza">👗 Moda e Beleza</option>
                        </select>

                        <label class="block mb-2 font-bold text-gray-700">2. Cole o Link (Mercado Livre)</label>
                        <div class="flex gap-2">
                            <input id="urlInput" type="text" class="flex-1 border p-3 rounded" placeholder="https://mercadolivre.com/sec/...">
                            <button onclick="processarAuto()" id="btnProcessar" class="bg-[#2d3277] text-white px-6 py-3 rounded font-bold hover:bg-blue-900 transition w-32 flex justify-center items-center">
                                <span>Buscar</span>
                            </button>
                        </div>
                    </div>

                    <div id="formManual" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-gray-700">Título</label>
                            <input id="manualTitle" type="text" class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700">Preço (R$)</label>
                            <input id="manualPrice" type="number" step="0.01" class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700">Categoria</label>
                            <select id="manualCategory" class="w-full border p-2 rounded">
                                <option value="Tecnologia">Tecnologia</option>
                                <option value="Cozinha">Cozinha</option>
                                <option value="Casa e Decoração">Casa e Decoração</option>
                                <option value="Moda e Beleza">Moda e Beleza</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-gray-700">Link da Imagem</label>
                            <input id="manualImage" type="text" class="w-full border p-2 rounded">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-gray-700">Link de Afiliado</label>
                            <input id="manualLink" type="text" class="w-full border p-2 rounded">
                        </div>
                        <div class="md:col-span-2">
                            <button onclick="salvarManual()" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 transition">Salvar Manualmente</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-4">Produto</th><th class="p-4">Preço</th><th class="p-4 text-right">Ação</th></tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let MINHA_SENHA = '';

        if(sessionStorage.getItem('adminToken')) {
            MINHA_SENHA = sessionStorage.getItem('adminToken');
            mostrarAdmin();
        }

        function fazerLogin() {
            const senha = document.getElementById('senhaInput').value;
            if(senha) {
                MINHA_SENHA = senha;
                sessionStorage.setItem('adminToken', senha);
                mostrarAdmin();
            }
        }

        function mostrarAdmin() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminContent').classList.remove('hidden');
            carregarProdutos();
        }

        function logout() { sessionStorage.removeItem('adminToken'); location.reload(); }

        function mudarAba(tipo) {
            const tabAuto = document.getElementById('tabAuto');
            const tabManual = document.getElementById('tabManual');
            const formAuto = document.getElementById('formAuto');
            const formManual = document.getElementById('formManual');

            if (tipo === 'auto') {
                formAuto.classList.remove('hidden'); formManual.classList.add('hidden');
                tabAuto.classList.add('text-[#2d3277]', 'border-b-4', 'border-[#2d3277]', 'bg-gray-50');
                tabManual.classList.remove('text-[#2d3277]', 'border-b-4', 'border-[#2d3277]', 'bg-gray-50');
            } else {
                formAuto.classList.add('hidden'); formManual.classList.remove('hidden');
                tabManual.classList.add('text-[#2d3277]', 'border-b-4', 'border-[#2d3277]', 'bg-gray-50');
                tabAuto.classList.remove('text-[#2d3277]', 'border-b-4', 'border-[#2d3277]', 'bg-gray-50');
            }
        }

        async function processarAuto() {
            const url = document.getElementById('urlInput').value;
            const category = document.getElementById('autoCategoryInput').value; // PEGA A CATEGORIA ESCOLHIDA
            
            if(!url) return alert('Cole um link');
            
            const btn = document.getElementById('btnProcessar');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i>'; 
            btn.disabled = true;

            try {
                // Envia Link E Categoria para o servidor
                const resScrape = await fetch(`${API_URL}/scrape?url=${encodeURIComponent(url)}&category=${encodeURIComponent(category)}`);
                const dados = await resScrape.json();
                
                if(dados.error || !dados.price) throw new Error(dados.error || "Preço não encontrado");

                await salvarNoBanco(dados);
                document.getElementById('urlInput').value = '';
                alert("Sucesso!");

            } catch (error) {
                alert('Erro na leitura automática. Redirecionando para o manual...');
                mudarAba('manual');
                document.getElementById('manualLink').value = url;
                document.getElementById('manualCategory').value = category; // Já seleciona a categoria certa no manual
            } finally {
                btn.innerHTML = originalText; 
                btn.disabled = false;
            }
        }

        async function salvarManual() {
            const title = document.getElementById('manualTitle').value;
            const price = parseFloat(document.getElementById('manualPrice').value);
            const category = document.getElementById('manualCategory').value;
            const thumbnail = document.getElementById('manualImage').value;
            const link = document.getElementById('manualLink').value;

            if(!title || !price || !link) return alert('Preencha os campos obrigatórios.');

            const dados = { title, price, category, thumbnail, link };
            await salvarNoBanco(dados);
            
            document.getElementById('manualTitle').value = '';
            document.getElementById('manualPrice').value = '';
            document.getElementById('manualImage').value = '';
            document.getElementById('manualLink').value = '';
            alert('Salvo manualmente!');
            mudarAba('auto');
        }

        async function salvarNoBanco(dados) {
            const res = await fetch(`${API_URL}/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-senha': MINHA_SENHA },
                body: JSON.stringify(dados)
            });
            if(res.status === 401) { alert('Senha incorreta.'); logout(); return; }
            carregarProdutos();
        }

        async function carregarProdutos() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const produtos = await res.json();
                const tbody = document.getElementById('listaProdutos');
                tbody.innerHTML = '';
                produtos.forEach(p => {
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4 flex items-center gap-3">
                                <img src="${p.thumbnail}" class="w-12 h-12 object-contain border rounded bg-white">
                                <div>
                                    <span class="font-medium text-sm line-clamp-1 w-64">${p.title}</span>
                                    <span class="text-xs bg-gray-200 px-2 py-1 rounded text-gray-600">${p.category}</span>
                                </div>
                            </td>
                            <td class="p-4 text-green-600 font-bold">R$ ${p.price.toLocaleString('pt-BR')}</td>
                            <td class="p-4 text-right">
                                <button onclick="deletar(${p.id})" class="text-red-600 hover:bg-red-50 p-2 rounded"><i class="ph-bold ph-trash text-xl"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        async function deletar(id) {
            if(confirm('Apagar?')) {
                await fetch(`${API_URL}/products/${id}`, { method: 'DELETE', headers: { 'x-admin-senha': MINHA_SENHA } });
                carregarProdutos();
            }
        }
    </script>
</body>
</html>
